name: 同步 Worker 文件

on:
  push:
    paths:
      - '少年你相信光吗'  # 关键：确保文件名完全一致

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 确保工作流有写入权限以提交更改
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 复制并重命名文件
        run: cp "少年你相信光吗" worker.js

      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "自动同步: 更新 worker.js [skip ci]" || exit 0
          git push
